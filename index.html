<style>
:root{--navy:#004848;--teal:#1AA993;--teal-d:#00605F;--ink:#0D2626;--mute:#4A5E5C;--bg:#F2F6F5;--line:#C5D3D1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);font-family:Montserrat,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.screen{display:none;min-height:100vh;min-height:calc(100vh + env(safe-area-inset-bottom));position:relative;overflow:hidden;flex-direction:column}
.screen.on{display:flex}
.wm{position:absolute;inset:0;opacity:.07;pointer-events:none}
.wm svg{display:block}
#splash .wm,#login .wm,#ok .wm{opacity:.16}
h1,h2,.gro{font-family:Montserrat,Arial,sans-serif;font-weight:800}
/* splash */
#splash,#login,#ok{background-color:var(--navy)}
#splash{align-items:center;justify-content:center;color:#fff}
#splash .logo{width:130px;position:relative}
#splash .logo svg{width:100%;height:auto;display:block}
#splash .x{font-family:Montserrat,Arial,sans-serif;font-size:30px;color:var(--teal);margin:18px 0 6px;position:relative}
#splash .photo{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:38px;letter-spacing:8px;position:relative}
#splash p{margin:22px 0 0;color:rgba(255,255,255,.75);font-size:15px;position:relative}
/* header */
.top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 20px) 22px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:20px;color:var(--navy)}
.brand svg{height:46px;width:auto}
.brand b{color:var(--teal-d)}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.hello{position:relative;padding:6px 22px 0}
.hello p{margin:0;color:var(--mute);font-size:15px}
.hello h1{margin:4px 0 0;font-size:27px;line-height:1.2}
.center{position:relative;flex:1;display:flex;align-items:center;justify-content:center;padding:0 22px}
.big{width:100%;height:132px;border:0;border-radius:24px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;gap:16px;font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:26px;box-shadow:0 12px 28px rgba(0,72,72,.28);cursor:pointer}
.big:active{transform:scale(.98)}
.plus{width:52px;height:52px;border-radius:26px;background:var(--teal);color:var(--navy);display:flex;align-items:center;justify-content:center}
.foot{position:relative;padding:0 22px calc(env(safe-area-inset-bottom) + 30px)}
.linkbtn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#fff;border:0;border-radius:16px;font:500 15px Montserrat,Arial,sans-serif;color:var(--navy);cursor:pointer}
/* bar */
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px;background:var(--navy);color:#fff}
.bar h1{margin:0;font-size:22px}
.back{width:44px;height:44px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* form */
form{flex:1;padding:18px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:13px;font-weight:600;color:#3B4858}
.f label i{color:#B3261E;font-style:normal}
.f input,.f textarea{height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font:16px Montserrat,Arial,sans-serif;background:#fff;color:var(--ink);width:100%;-webkit-appearance:none}
.f textarea{height:auto;padding:12px 14px;resize:none}
.f input:focus,.f textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.submit{margin-top:8px;height:56px;border:0;border-radius:16px;background:var(--teal);color:var(--navy);font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:18px;cursor:pointer}
.submit:disabled{opacity:.6}
.err{color:#B3261E;font-size:14px;min-height:18px}
/* ok */
#ok{color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px}
#ok .tick{width:84px;height:84px;border-radius:42px;background:var(--teal);display:flex;align-items:center;justify-content:center;margin-bottom:22px;position:relative}
#ok h1{margin:0 0 8px;font-size:28px;position:relative}
#ok p{margin:0 0 30px;color:rgba(255,255,255,.8);position:relative}
#ok .linkbtn{max-width:320px;justify-content:center;position:relative}
/* suivi */
.list{padding:14px;display:flex;flex-direction:column;gap:12px}
.alert{display:flex;gap:12px;padding:14px 16px;background:#FFF4E3;border:1px solid #F2C27A;border-radius:14px;font-size:14px;line-height:1.4}
.card{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h2{margin:0;font-size:17px}
.card .c{font-size:12px;color:var(--mute);white-space:nowrap}
.card .d{font-size:13px;color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:0;font:600 12px Montserrat,Arial,sans-serif;min-height:34px}
.s0{background:#FFE7C2;color:#7A4505}.s1{background:#D3EEE9;color:#004848}.s2{background:#D6EEDD;color:#1D5A2E}
button.chip{cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px 20px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite;display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}
.f input[type=date]{display:block;line-height:46px;cursor:pointer;touch-action:manipulation}
.f input[type=date]::-webkit-date-and-time-value{text-align:left}
.f input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.card.edit{cursor:pointer}
.card .mod{font-size:13px;font-weight:600;color:var(--teal-d);align-self:flex-end;background:none;border:0;padding:6px 0;font-family:inherit;cursor:pointer}
button,input,a{touch-action:manipulation}
html,body{overscroll-behavior:none}
#login{color:#fff;justify-content:center;padding:30px 24px calc(env(safe-area-inset-bottom) + 30px)}
#login .card2{flex:none;position:relative;background:#fff;color:var(--ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px}
#login h1{margin:0;font-size:24px}
#login p{margin:0;color:var(--mute);font-size:14px}
#login .logo{width:110px;margin:0 auto 26px;position:relative}
#login .logo svg{width:100%;height:auto;display:block}
.avatar{border:0;cursor:pointer}
</style>
</head>

<section class="screen on" id="splash">
  <div class="wm" aria-hidden="true"><svg width="100%" height="100%"><rect width="100%" height="100%" fill="url(#motif)"/></svg></div>
  <div class="logo" role="img" aria-label="ICAR Concept &amp; Design"><svg viewBox="0 0 220.22 339.41"><use href="#logoW"/></svg></div>
  <div class="x" aria-hidden="true">×</div>
  <div class="photo">PHOTO</div>
  <p>Suivi des chantiers &amp; du photographe</p>
</section>


<section class="screen" id="login">
  <div class="wm" aria-hidden="true"><svg width="100%" height="100%"><rect width="100%" height="100%" fill="url(#motif)"/></svg></div>
  <div class="logo" role="img" aria-label="ICAR Concept &amp; Design"><svg viewBox="0 0 220.22 339.41"><use href="#logoW"/></svg></div>
  <form class="card2" onsubmit="connexion(event)">
    <h1>Bienvenue</h1>
    <p>Première ouverture sur ce téléphone : indique ton nom et le code ICAR.</p>
    <div class="f"><label for="l-nom">Ton prénom et nom <i>*</i></label><input id="l-nom" required autocomplete="name"></div>
    <div class="f"><label for="l-code">Code ICAR <i>*</i></label><input id="l-code" required autocapitalize="characters" autocomplete="off"></div>
    <div class="err" id="l-err" role="alert"></div>
    <button class="submit" id="l-btn" type="submit">Entrer</button>
  </form>
</section>

<section class="screen" id="home">
  <div class="wm" aria-hidden="true"><svg width="100%" height="100%"><rect width="100%" height="100%" fill="url(#motif)"/></svg></div>
  <header class="top">
    <div class="brand"><svg role="img" aria-label="ICAR Concept &amp; Design" viewBox="0 0 220.22 339.41"><use href="#logoD"/></svg><span><b>×</b> PHOTO</span></div>
    <button class="avatar" id="avatar" type="button" aria-label="Changer d'utilisateur" onclick="deconnexion()">·</button>
  </header>
  <div class="hello"><p id="bonjour">Bonjour,</p><h1>Un nouveau chantier à déclarer ?</h1></div>
  <div class="center">
    <button class="big" type="button" onclick="nouveau()">
      <span class="plus"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      Créer chantier
    </button>
  </div>
  <div class="foot"><button class="linkbtn" type="button" onclick="ouvrirSuivi()"><span id="lbl-suivi">Mes chantiers déclarés</span><span aria-hidden="true">›</span></button></div>
</section>

<section class="screen" id="form">
  <div class="bar">
    <button class="back" type="button" aria-label="Retour" onclick="go(EDIT?'suivi':'home')"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="titre-form">Nouveau chantier</h1>
  </div>
  <form id="f" onsubmit="envoyer(event)">
    <div class="f"><label for="nom">Nom du chantier <i>*</i></label><input id="nom" required placeholder="Ex. Les Ulysses"></div>
    <div class="f"><label for="client">Client</label><input id="client"></div>
    <div class="f"><label for="adresse">Adresse du chantier <i>*</i></label><input id="adresse" required placeholder="N°, rue"></div>
    <div class="f"><label for="ville">Ville</label><input id="ville"></div>
    <div class="f"><label for="conducteur">Conducteur de travaux <i>*</i></label><input id="conducteur" required></div>
    <div class="row2">
      <div class="f"><label for="debut">Début <i>*</i></label><input id="debut" type="date" required onclick="pick(this)"></div>
      <div class="f"><label for="fin">Fin prévue <i>*</i></label><input id="fin" type="date" required onclick="pick(this)"></div>
    </div>
    <div class="row2">
      <div class="f"><label for="contact">Contact sur place</label><input id="contact"></div>
      <div class="f"><label for="tel">Téléphone</label><input id="tel" type="tel" inputmode="tel"></div>
    </div>
    <div class="f"><label for="remarques">Remarques (accès, code, étage…)</label><textarea id="remarques" rows="3"></textarea></div>
    <div class="err" id="err" role="alert"></div>
    <button class="submit" id="btn" type="submit">Enregistrer le chantier</button>
  </form>
</section>

<section class="screen" id="ok">
  <div class="wm" aria-hidden="true"><svg width="100%" height="100%"><rect width="100%" height="100%" fill="url(#motif)"/></svg></div>
  <div class="tick"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1>Chantier enregistré</h1>
  <p>Merci ! Le suivi photographe est prévenu.</p>
  <button class="linkbtn" type="button" onclick="go('home')">Retour à l'accueil</button>
</section>

<section class="screen" id="suivi">
  <div class="bar">
    <button class="back" type="button" aria-label="Retour" onclick="go('home')"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="titre-suivi">Mes chantiers</h1>
  </div>
  <div class="list" id="list"><div class="empty">Chargement…</div></div>
</section>

<script>
var API = 'https://script.google.com/macros/s/AKfycby37lrHAO8eUWifxtvZXGT8t_JXg8gUScN4UOdj7J7F8EtwWA0rMTTwVfII1NN5N9es/exec';
var STATUTS = ['À contacter','Contacté','Fait'];
var EDIT = null;
function pick(i){ try{ if(i.showPicker) i.showPicker(); }catch(e){} }
function nouveau(){ EDIT=null; document.getElementById('f').reset(); document.getElementById('conducteur').value=S.nom; document.getElementById('titre-form').textContent='Nouveau chantier'; document.getElementById('btn').textContent='Enregistrer le chantier'; document.getElementById('err').textContent=''; go('form'); }
function modifier(c){ EDIT=c.id; var m={nom:c.nom,client:c.client,adresse:c.adresse,ville:c.ville,conducteur:c.conducteur,debut:c.debutIso,fin:c.finIso,contact:c.contact,tel:String(c.tel||'').replace(/^'/,''),remarques:c.remarques}; Object.keys(m).forEach(function(k){ document.getElementById(k).value = (m[k]==null?'':m[k]); }); document.getElementById('titre-form').textContent='Modifier le chantier'; document.getElementById('btn').textContent='Enregistrer les modifications'; document.getElementById('err').textContent=''; go('form'); }
var S = {nom: localStorage.getItem('icar_nom')||'', code: localStorage.getItem('icar_code')||'', role: localStorage.getItem('icar_role')||''};
function go(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on', s.id===id)}); var dk=(id==='splash'||id==='login'||id==='ok'); document.documentElement.style.background=document.body.style.background=dk?'#004848':'#F2F6F5'; window.scrollTo(0,0);}
function api(action, payload){
  var body = Object.assign({action: action, code: S.code, nom: S.nom}, payload||{});
  return fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(j){ if(!j.ok) throw new Error(j.error||'Erreur'); return j.data; });
}
function initUI(){
  var ini = (S.nom||'?').split(/\s+/).map(function(x){return x.charAt(0)}).join('').slice(0,2).toUpperCase();
  document.getElementById('avatar').textContent = ini;
  document.getElementById('bonjour').textContent = 'Bonjour ' + (S.nom.split(' ')[0]||'') + ',';
  document.getElementById('conducteur').value = S.nom;
  var admin = S.role==='admin';
  document.getElementById('lbl-suivi').textContent = admin ? 'Suivi photographe' : 'Mes chantiers déclarés';
  document.getElementById('titre-suivi').textContent = admin ? 'Suivi photographe' : 'Mes chantiers';
}
setTimeout(function(){ if(S.code && S.nom){ initUI(); go('home'); } else go('login'); }, 1400);

function connexion(e){
  e.preventDefault();
  var err=document.getElementById('l-err'), btn=document.getElementById('l-btn');
  err.textContent=''; btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  S.nom=document.getElementById('l-nom').value.trim(); S.code=document.getElementById('l-code').value.trim().toUpperCase();
  api('login').then(function(d){
    S.role=d.role;
    localStorage.setItem('icar_nom',S.nom); localStorage.setItem('icar_code',S.code); localStorage.setItem('icar_role',S.role);
    btn.disabled=false; btn.textContent='Entrer'; initUI(); go('home');
  }).catch(function(x){ btn.disabled=false; btn.textContent='Entrer'; err.textContent=x.message; });
}
function deconnexion(){
  if(!confirm('Changer d\'utilisateur sur ce téléphone ?')) return;
  ['icar_nom','icar_code','icar_role'].forEach(function(k){localStorage.removeItem(k)});
  S={nom:'',code:'',role:''}; go('login');
}

function v(id){return document.getElementById(id).value.trim();}
function envoyer(e){
  e.preventDefault();
  var err=document.getElementById('err'), btn=document.getElementById('btn');
  err.textContent='';
  var d={nom:v('nom'),client:v('client'),adresse:v('adresse'),ville:v('ville'),conducteur:v('conducteur'),debut:v('debut'),fin:v('fin'),contact:v('contact'),tel:v('tel'),remarques:v('remarques')};
  if(d.fin < d.debut){err.textContent='La date de fin est avant la date de début.';return;}
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  var lbl = EDIT ? 'Enregistrer les modifications' : 'Enregistrer le chantier';
  (EDIT ? api('update',{id:EDIT,data:d}) : api('create',{data:d})).then(function(){
    btn.disabled=false; btn.textContent=lbl;
    document.getElementById('f').reset(); document.getElementById('conducteur').value=S.nom;
    if(EDIT){ EDIT=null; ouvrirSuivi(); } else go('ok');
  }).catch(function(x){
    btn.disabled=false; btn.textContent=lbl;
    err.textContent = x.message || 'Erreur, réessaie.';
  });
}

function el(tag, cls, txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;}
function chip(c, champ, label){
  var admin = S.role==='admin';
  var i = Math.max(0, STATUTS.indexOf(champ==='debut'?c.photoDebut:c.photoFin));
  var b = el(admin?'button':'span', 'chip s'+i, label+' : '+STATUTS[i].toLowerCase());
  if (admin){
    b.type='button';
    b.onclick=function(){
      var n=(i+1)%STATUTS.length; b.disabled=true;
      api('status',{id:c.id, champ:champ, valeur:STATUTS[n]}).then(function(){
        if(champ==='debut') c.photoDebut=STATUTS[n]; else c.photoFin=STATUTS[n];
        b.replaceWith(chip(c, champ, label));
      }).catch(function(x){b.disabled=false; alert(x.message);});
    };
  }
  return b;
}
function ouvrirSuivi(){
  go('suivi');
  var L=document.getElementById('list'); L.innerHTML='<div class="empty">Chargement…</div>';
  api('list').then(function(rows){
    L.innerHTML='';
    if(!rows.length){L.appendChild(el('div','empty','Aucun chantier pour l\'instant.'));return;}
    var today=new Date(); today.setHours(0,0,0,0);
    var bientot=rows.filter(function(c){var j=(c.debutTs-today.getTime())/86400000; return c.photoDebut==='À contacter' && j>=0 && j<=7;});
    if(S.role==='admin' && bientot.length){
      var a=el('div','alert'); a.setAttribute('role','status');
      a.innerHTML='<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A5A06" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>';
      var t=el('div'); t.appendChild(el('strong',null,'Appeler le photographe')); t.appendChild(document.createElement('br'));
      t.appendChild(document.createTextNode(bientot.map(function(c){return c.nom+' ('+c.debut+')'}).join(', ')+' démarre bientôt'));
      a.appendChild(t); L.appendChild(a);
    }
    rows.forEach(function(c){
      var k=el('article','card'), h=el('div','h');
      h.appendChild(el('h2',null,c.nom)); h.appendChild(el('span','c',c.conducteur)); k.appendChild(h);
      k.appendChild(el('div','d',[c.adresse,c.ville].filter(Boolean).join(', ')));
      k.appendChild(el('div','d','Début '+c.debut+' · Fin '+c.fin));
      var ch=el('div','chips'); ch.appendChild(chip(c,'debut','Début')); ch.appendChild(chip(c,'fin','Fin')); k.appendChild(ch);
      var mb=el('button','mod','Modifier ›'); mb.type='button'; mb.onclick=function(){ modifier(c); }; k.appendChild(mb);
      L.appendChild(k);
    });
  }).catch(function(x){L.innerHTML=''; L.appendChild(el('div','empty','Erreur : '+x.message));});
}
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
